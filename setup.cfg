[metadata]
name = talk-to-blog
version = 0.2.0
description = Turn talk transcripts into Markdown learning artifacts
long_description = file: README.md
long_description_content_type = text/markdown
author = Ryan Johnson
author_email = ryanleejwebdev@gmail.com
url = https://github.com/ryan258/talk-to-blog
license = MIT

[options]
packages = find:
python_requires = >=3.8

[options.packages.find]
include = talk_to_blog*

[options.entry_points]
console_scripts =
    talk-to-blog = talk_to_blog.cli:main
    y2t = talk_to_blog.cli:main
